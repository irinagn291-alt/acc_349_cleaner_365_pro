name: Cleaner365
packages:
  Alamofire:
    url: https://github.com/otazugudy274-ai/Alamofire
    revision: 9799237b84cbd97f80a3ac9b69b30ba65139f752
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: '18.0'
    watchOS: '11.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: 'YES'
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    TARGETED_DEVICE_FAMILY: '1'
    SUPPORTS_MACCATALYST: 'NO'
targets:
  Cleaner365:
    type: application
    platform: iOS
    sources:
    - Cleaner365
    - Shared
    dependencies:
    - target: Cleaner365Widget
    - target: Cleaner365Watch
    - package: Alamofire
    entitlements:
      path: Cleaner365/Cleaner365.entitlements
      properties:
        com.apple.security.application-groups:
        - group.app.cleaner365.iphone
    info:
      path: Cleaner365/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
        - CFBundleURLSchemes:
          - cleaner365
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_BUNDLE_IDENTIFIER: app.cleaner365.iphone
        INFOPLIST_KEY_CFBundleDisplayName: Cleaner 365
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: 'NO'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSFaceIDUsageDescription: Use Face ID to open your private photo vault.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Restore selected photos and Live Photos from your vault.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Review photos and videos. You choose which originals to delete from Photos.
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
  Cleaner365Widget:
    type: app-extension
    platform: iOS
    sources:
    - Widget
    - Shared
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_BUNDLE_IDENTIFIER: app.cleaner365.iphone.widget
        INFOPLIST_KEY_CFBundleDisplayName: Season progress
        APPLICATION_EXTENSION_API_ONLY: 'YES'
        SKIP_INSTALL: 'YES'
    info:
      path: Widget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups:
        - group.app.cleaner365.iphone
  Cleaner365Watch:
    type: application
    platform: watchOS
    sources:
    - path: Cleaner365Watch
    - Watch
    - Shared
    settings:
      base:
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: '1'
        PRODUCT_BUNDLE_IDENTIFIER: app.cleaner365.iphone.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: Cleaner 365
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: 'NO'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_WKApplication: 'YES'
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: app.cleaner365.iphone
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: 'NO'
        SKIP_INSTALL: 'YES'
        TARGETED_DEVICE_FAMILY: '4'
  Cleaner365Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - Cleaner365Tests
    - TestFixtures
    dependencies:
    - target: Cleaner365
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cleaner365.iphone.tests
  Cleaner365UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - Cleaner365UITests
    - TestFixtures
    dependencies:
    - target: Cleaner365
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cleaner365.iphone.uitests
schemes:
  Cleaner365:
    build:
      targets:
        Cleaner365: all
    test:
      targets:
      - Cleaner365Tests
      - Cleaner365UITests
